<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura Sanctuary</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; padding: 24px; box-sizing: border-box; text-align: center;
        background: #1a1410; color: #e8d9bf; font-family: system-ui, sans-serif;
      }
      h1 { font-size: 20px; margin: 0; color: #d99630; }
      p { margin: 0; max-width: 320px; line-height: 1.5; opacity: 0.85; }
      button {
        margin-top: 8px; padding: 12px 28px; border: 0; border-radius: 6px;
        background: #d99630; color: #1a1410; font-size: 16px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>The sanctuary is out of reach</h1>
    <p>Aura needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.replace('https://aurasanctuary.netlify.app/')">Try again</button>
  </body>
</html>

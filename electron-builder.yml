appId: app.aurasanctuary.desktop
productName: "Aura Sanctuary"

directories:
  output: release

files:
  - dist/**/*
  - electron-dist/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - target: AppImage
      arch:
        - x64

publish:
  provider: github
  owner: EtritHasolli
  repo: aura-sanctuary

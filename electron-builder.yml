appId: app.aurasanctuary.desktop
productName: "Aura Sanctuary"
icon: build/icon.png

directories:
  output: release

files:
  - dist/**/*
  - electron-dist/**/*
  - package.json

nsis:
  createDesktopShortcut: always

win:
  target:
    - target: nsis
      arch:
        - x64

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - target: AppImage
      arch:
        - x64

publish:
  provider: github
  owner: EtritHasolli
  repo: aura-sanctuary
  releaseType: release
  private: true
  token: ${GH_TOKEN}

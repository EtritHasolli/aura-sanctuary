name: Keep Supabase Alive

# Free-tier Supabase projects pause after ~7 days of inactivity. This pings the
# REST API every 3 days so the project stays warm. Also runnable manually.
on:
  schedule:
    - cron: "0 9 */3 * *" # every 3 days at 09:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase to keep the project awake..."
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/")
          echo "HTTP $code"
          # Any 2xx/3xx/4xx means the server responded (project is awake).
          # Only a network failure / 5xx is treated as a problem.
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
            echo "Supabase did not respond healthily (HTTP $code)"
            exit 1
          fi
          echo "Supabase is awake."
